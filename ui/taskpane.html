<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WpsForge AI - 智能表格伴侣</title>
    <!-- 模块化样式聚合入口 -->
    <link rel="stylesheet" href="css/taskpane.css">
</head>
<body>
<div id="app">
    <!-- 顶部玻璃拟态导航栏 -->
    <header>
        <div class="brand-wrap">
            <div class="brand-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6Z"/>
                </svg>
            </div>
            <div class="brand-text">
                <div class="title">
                    WpsForge AI
                    <span id="model-badge" class="model-badge" title="当前连接模型"><span class="model-dot"></span><span id="model-badge-name">deepseek</span></span>
                </div>
            </div>
        </div>
        <div class="header-btns">
            <button id="btnClear" class="icon-btn" title="清空当前对话记录">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <button id="btnHide" class="icon-btn" title="收起侧边栏">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </header>

    <!-- 顶部多模块切换选项卡 -->
    <nav class="tab-bar">
        <button class="tab-btn active" data-tab="chat">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span>智能对话</span>
        </button>
        <button class="tab-btn" data-tab="scenarios">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <span>场景指令</span>
        </button>
        <button class="tab-btn" data-tab="toolbox">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            <span>快捷工具</span>
        </button>
        <button class="tab-btn" data-tab="settings">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>模型设置</span>
        </button>
    </nav>

    <!-- 实时选区感知工具条 -->
    <div class="selection-bar">
        <div class="sel-info">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>
            <span id="sel-pill" class="sel-pill">正在获取选区…</span>
        </div>
        <div class="sel-actions">
            <button id="btnRefreshSel" class="sel-chip-btn" title="重新获取选区">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                <span>刷新</span>
            </button>
            <button id="btnInsertSel" class="sel-chip-btn" title="在输入框中引用当前选区">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                <span>带入选区</span>
            </button>
            <button id="btnQuickStatsSel" class="sel-chip-btn" title="一键统计当前选区数据">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><line x1="8" y1="10" x2="8.01" y2="10"></line><line x1="12" y1="10" x2="12.01" y2="10"></line><line x1="16" y1="10" x2="16.01" y2="10"></line></svg>
                <span>统计</span>
            </button>
        </div>
    </div>

    <!-- Tab 1: 智能对话视图 -->
    <section id="view-chat" class="tab-content-view active">
        <!-- 消息对话区域 -->
        <div id="chat"></div>

        <!-- 快捷指令栏 (数据驱动渲染) -->
        <div id="quick"></div>

        <!-- 底部输入栏 -->
        <footer>
            <div id="context-tag" class="context-tag">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle></svg>
                <span id="context-tag-text">已关联选区: A1:D10</span>
                <span id="context-tag-close" class="context-tag-close" title="取消关联选区">×</span>
            </div>
            <div class="input-box-wrap">
                <textarea id="input" placeholder="输入你想对表格做的事，Enter 发送…"></textarea>
                <div class="input-btns">
                    <button id="btnStop" class="btn-stop" title="停止生成">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
                    </button>
                    <button id="btnSend" class="send-btn" title="发送 (Enter)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
            <div class="footer-status-bar">
                <span>Enter 发送 · Shift+Enter 换行 · 支持 Ctrl+Z 撤销</span>
                <span id="status"></span>
            </div>
        </footer>
    </section>

    <!-- Tab 2: 场景指令库视图 (数据驱动渲染) -->
    <section id="view-scenarios" class="tab-content-view">
        <div id="scenarios-container"></div>
    </section>

    <!-- Tab 3: 快捷工具箱视图 (离线免 Token 即时执行 - 数据驱动渲染) -->
    <section id="view-toolbox" class="tab-content-view">
        <div id="toolbox-container"></div>

        <!-- 结果反馈模态面板 -->
        <div id="tb-modal" class="toolbox-modal">
            <div class="tb-modal-title">
                <span id="tb-modal-title-text">操作结果</span>
                <button id="tb-modal-close" style="background:none;border:none;cursor:pointer;font-size:14px;color:#64748b;">✕</button>
            </div>
            <div id="tb-modal-body" class="tb-modal-content"></div>
        </div>
    </section>

    <!-- Tab 4: 模型设置中心视图 -->
    <section id="view-settings" class="tab-content-view">
        <div class="settings-card">
            <div class="form-group">
                <label>模型服务商预设</label>
                <select id="s-provider">
                    <option value="deepseek">DeepSeek (推荐 · 极高性价比与出色工具调用)</option>
                    <option value="siliconflow">硅基流动 SiliconFlow (DeepSeek-V3/R1)</option>
                    <option value="kimi">Kimi (月之暗面 Moonshot)</option>
                    <option value="glm">智谱 GLM (BigModel glm-4-flash)</option>
                    <option value="openai">OpenAI (GPT-4o mini)</option>
                    <option value="ollama">Ollama 本地模型 (127.0.0.1:11434)</option>
                    <option value="custom">自定义 (OpenAI 兼容规范接口)</option>
                </select>
            </div>
            <div class="form-group" id="wrap-base">
                <label>接口地址 (Base URL)</label>
                <input id="s-base" placeholder="https://api.deepseek.com/v1" autocomplete="off">
            </div>
            <div class="form-group">
                <label>API Key</label>
                <div class="input-addon-wrap">
                    <input id="s-key" type="password" placeholder="sk-..." autocomplete="off">
                    <button id="btnEye" class="addon-btn" title="显示/隐藏密钥">
                        <svg id="eye-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>模型名称 (Model)</label>
                <input id="s-model" placeholder="deepseek-chat" autocomplete="off">
            </div>
            <div class="form-group">
                <label>模型温度 (Temperature - 越低越严谨精准)</label>
                <div class="range-wrap">
                    <input id="s-temp" type="range" min="0" max="1" step="0.05" value="0.2">
                    <span id="s-temp-val" class="range-val">0.2</span>
                </div>
            </div>
            <div class="hint-box">
                <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px;font-weight:600;color:#334155">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span>隐私安全与直连说明</span>
                </div>
                API Key 严格保存在本地浏览器缓存中。发起请求时支持直连与本地同源代理自动回退（Vite 服务端 <code>wfLlmProxyPlugin</code>），免除跨域限制。
            </div>
            <div class="settings-actions">
                <button id="btnTest" class="btn-secondary">测试连接</button>
                <button id="btnSave" class="btn-primary">保存配置</button>
            </div>
            <div id="test-result"></div>
        </div>
    </section>
</div>

<!-- 右键上下文菜单 -->
<div id="ctxmenu"></div>

<!-- 1. 表格操作底层引擎 (与功能区 main.js 共享) -->
<script type="text/javascript" src="../js/util.js"></script>
<script type="text/javascript" src="../js/tools/core.js"></script>
<script type="text/javascript" src="../js/tools/clean.js"></script>
<script type="text/javascript" src="../js/tools/format.js"></script>
<script type="text/javascript" src="../js/tools/advanced.js"></script>
<script type="text/javascript" src="../js/tools/schema.js"></script>
<script type="text/javascript" src="../js/tools.js"></script>

<!-- 2. Taskpane 交互组件与业务模块 -->
<script type="text/javascript" src="../js/taskpane/constants.js"></script>
<script type="text/javascript" src="../js/taskpane/utils.js"></script>
<script type="text/javascript" src="../js/taskpane/state.js"></script>
<script type="text/javascript" src="../js/taskpane/selection.js"></script>
<script type="text/javascript" src="../js/taskpane/llm.js"></script>
<script type="text/javascript" src="../js/taskpane/ui.js"></script>
<script type="text/javascript" src="../js/taskpane/orchestrator.js"></script>
<script type="text/javascript" src="../js/taskpane/data.js"></script>
<script type="text/javascript" src="../js/taskpane/tabs.js"></script>
<script type="text/javascript" src="../js/taskpane.js"></script>
</body>
</html>
